<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Churn Risk Assessment API architecture</title><desc id="desc">An API client sends five numeric features through Laravel request validation and prompt construction to an OpenAI client, then receives a JSON response; no trained model is implied.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#946b42"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#ffd18a"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#ffd18a}.t{font:700 32px Segoe UI,Arial;fill:#fffaf0}.s{font:400 15px Segoe UI,Arial;fill:#f4e1c2}.n{fill:#304162;stroke:#7b87a2;stroke-width:2}.g{fill:#3c4c71;stroke:#ffd18a;stroke-width:2}.y{fill:#34575b;stroke:#a8e8ff;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#f0e0c8}.q{font:400 12px Segoe UI,Arial;fill:#ddcbb2}.r{stroke:#ffd18a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">CHURN RISK ASSESSMENT API � SERVICE BOUNDARY MAP</text><text x="64" y="106" class="t">A reviewable API experiment, not a trained predictor</text><text x="64" y="136" class="s">Source-backed from routes/api.php, PredictiveAnalyticsController.php, composer.json, and feature tests.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">API client</text><text x="195" y="290" text-anchor="middle" class="b">five numeric fields</text><text x="195" y="318" text-anchor="middle" class="q">POST /api/v1/predict-churn</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">Laravel validation</text><text x="555" y="290" text-anchor="middle" class="b">request boundary</text><text x="555" y="318" text-anchor="middle" class="q">shape + numeric rules</text><path d="M680 285H790" class="r"/><rect x="790" y="220" width="250" height="130" rx="16" class="g"/><text x="915" y="260" text-anchor="middle" class="l">Prompt construction</text><text x="915" y="290" text-anchor="middle" class="b">controller  service</text><text x="915" y="318" text-anchor="middle" class="q">external inference request</text><path d="M1040 285H1150" class="r"/><rect x="1150" y="220" width="280" height="130" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">OpenAI client</text><text x="1290" y="290" text-anchor="middle" class="b">provider call</text><text x="1290" y="318" text-anchor="middle" class="q">compatibility unverified</text><path d="M1290 350V500H940" class="r"/><rect x="650" y="520" width="580" height="92" rx="16" class="n"/><text x="940" y="557" text-anchor="middle" class="l">JSON response contract</text><text x="940" y="584" text-anchor="middle" class="q">offline provider-contract test; no statistical model or benchmark dataset claimed</text></svg>

