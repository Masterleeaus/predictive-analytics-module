<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Churn Risk Assessment API</title><desc id="desc">An amber and blue experimental API banner showing validated inputs, prompt construction, external model call, and JSON response.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#946b42"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 42px Segoe UI,Arial;fill:#fffaf0}.s{font:600 15px Segoe UI,Arial;letter-spacing:2.2px;fill:#f4e1c2}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#ffd18a}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#dfd0bd}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1090" cy="35" r="220" fill="#8dd7ff" opacity=".11"/><text x="70" y="66" class="e">CHURN RISK ASSESSMENT API � EXPERIMENTAL � LARAVEL</text><text x="70" y="125" class="t">Churn Risk Assessment API</text><text x="72" y="160" class="s">VALIDATE    CONSTRUCT PROMPT    EXTERNAL MODEL    JSON RESPONSE</text><path d="M110 245H1090" stroke="#7b87a2" stroke-width="2"/><path d="M144 245H1050" stroke="#ffd18a" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#3c4c71" stroke="#ffd18a" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">5 features</text><text x="144" y="312" text-anchor="middle" class="q">numeric input</text><circle cx="383" cy="245" r="24" fill="#3c4c71" stroke="#ffd18a" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="q">Laravel validation</text><circle cx="622" cy="245" r="24" fill="#3c4c71" stroke="#ffd18a" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Prompt</text><text x="622" y="312" text-anchor="middle" class="q">service boundary</text><circle cx="861" cy="245" r="24" fill="#3c4c71" stroke="#ffd18a" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="q">OpenAI client</text><circle cx="1050" cy="245" r="24" fill="#34575b" stroke="#a8e8ff" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">JSON</text><text x="1050" y="312" text-anchor="middle" class="q">contract response</text></g><text x="70" y="342" class="q">Not a trained statistical or machine-learning model; provider compatibility remains unverified</text></svg>

